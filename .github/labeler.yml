---
docker:
  - changed-files:
      - any-glob-to-any-file: Dockerfile
      - any-glob-to-any-file: docker-bake.hcl
      - any-glob-to-any-file: .dockerignore

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**
      - any-glob-to-any-file: Makefile

documentation:
  - changed-files:
      - any-glob-to-any-file: "*.md"
      - any-glob-to-any-file: docs/**
      - any-glob-to-any-file: examples/**

dependencies:
  - changed-files:
      - any-glob-to-any-file: renovate.json5

# Branch-based labels
feature:
  - head-branch: ["^feat", "feat"]
fix:
  - head-branch: ["^fix", "fix"]
chore:
  - head-branch: ["^chore", "chore"]
docs:
  - head-branch: ["^docs", "docs"]
security:
  - head-branch: ["^security", "security"]
