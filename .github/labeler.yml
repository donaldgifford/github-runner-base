---
# yaml-language-server: $schema=https://www.schemastore.org/pull-request-labeler.json
# Auto-labels PRs by what they touch and by branch prefix.
# `scripts/labels.sh` creates every label named here.

docker:
  - changed-files:
      - any-glob-to-any-file: Dockerfile
      - any-glob-to-any-file: docker-bake.hcl
      - any-glob-to-any-file: .dockerignore

dependencies:
  - changed-files:
      - any-glob-to-any-file: mise.toml
      - any-glob-to-any-file: renovate.json5
      - any-glob-to-any-file: renovate.json

documentation:
  - changed-files:
      - any-glob-to-any-file: docs/**
      - any-glob-to-any-file: README.md
      - any-glob-to-any-file: TROUBLESHOOTING.md
      - any-glob-to-any-file: examples/**

ci:
  - changed-files:
      - any-glob-to-any-file: .github/**
      - any-glob-to-any-file: justfile

repo:
  - changed-files:
      - any-glob-to-any-file: .markdownlint.yaml
      - any-glob-to-any-file: .prettierrc.yaml
      - any-glob-to-any-file: .yamlfmt.yml
      - any-glob-to-any-file: .yamllint.yml
      - any-glob-to-any-file: cliff.toml
      - any-glob-to-any-file: scripts/**

ai:
  - changed-files:
      - any-glob-to-any-file: CLAUDE.md
      - any-glob-to-any-file: .claude/**

security:
  - changed-files:
      - any-glob-to-any-file: .trivyignore.yaml
  - head-branch: ["^security"]

# Branch-prefix labels. The regexes are anchored but deliberately loose at
# the tail so `feat/x` and `feature/x` both land on `feature`.
feature:
  - head-branch: ["^feat"]
fix:
  - head-branch: ["^fix"]
chore:
  - head-branch: ["^chore"]
docs:
  - head-branch: ["^docs"]
bug:
  - head-branch: ["^bug"]
