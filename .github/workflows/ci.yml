---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/donaldgifford/github-runner-base

jobs:
  labeler:
    name: Label PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v4

      # hadolint + actionlint + yamllint + markdownlint + prettier. The
      # recipe is the contract: whatever `just lint` runs locally runs here.
      - name: Run linters
        run: just lint

  build:
    name: Build & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Set up mise
        uses: jdx/mise-action@v4

      # The `ci` bake target is linux/amd64 with output=type=docker, so the
      # image lands in the local daemon where the steps below can run and
      # scan it. No registry push happens on a PR.
      - name: Build image
        uses: docker/bake-action@v7
        with:
          targets: ci
          source: .
          files: docker-bake.hcl
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Verify toolchain in image
        run: just test ci

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true

      # Two scans on purpose. This one reports everything CRITICAL/HIGH —
      # including vulnerabilities with no fix available — to the Security
      # tab so the full picture is visible and trackable over time. It never
      # fails the build.
      - name: Scan image for the Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      # Fork PRs get a read-only token, so the upload would 403. They are
      # still scanned and still blocked by the gate below — they just do not
      # populate code scanning.
      - name: Upload Trivy results to code scanning
        if: >-
          always() && (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # ...and this one is the merge gate. Only fixable CRITICALs fail it:
      # an unfixable CVE in the upstream runner base image is not something a
      # PR here can act on, so blocking on it would only teach people to
      # ignore red. Mirrors `just scan ci`. Exceptions go in .trivyignore.yaml.
      - name: Block on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          image-ref: ${{ env.IMAGE }}:ci
          scanners: vuln
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          skip-setup-trivy: true
