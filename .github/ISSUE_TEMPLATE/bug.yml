---
name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Image contents (a tool is missing or broken)
        - Docker / image build
        - ARC compatibility
        - Supply chain (signing, SBOM, attestations)
        - CI / release
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: The workflow step, `docker run` command, or ARC manifest that triggers it
      placeholder: |
        1. docker run --rm ghcr.io/donaldgifford/github-runner-base:latest ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version
      description: Image tag or digest where you hit this
    validations:
      required: false
